services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: upay_coach
      POSTGRES_USER: upay
      POSTGRES_PASSWORD: upay
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://upay:upay@db:5432/upay_coach
      FRONTEND_URL: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  postgres_data:
